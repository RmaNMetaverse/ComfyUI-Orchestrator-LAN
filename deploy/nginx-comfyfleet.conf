# ComfyFleet behind nginx.
#
#   sudo cp deploy/nginx-comfyfleet.conf /etc/nginx/sites-available/comfyfleet
#   sudo ln -s /etc/nginx/sites-available/comfyfleet /etc/nginx/sites-enabled/comfyfleet
#   sudo rm -f /etc/nginx/sites-enabled/default      # if it would clash on port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx does NOT serve the app's files: ComfyFleet is a Node server with a live API, so
# nginx only forwards to it. Putting the folder in a web root and pointing nginx at the
# files would give you a page that cannot talk to anything.

server {
    listen 80;
    listen [::]:80;
    server_name virtualdev _;

    # Uploaded videos can be large. 0 = no limit; set a number if you would rather cap it.
    client_max_body_size 0;

    # A long render keeps its connection open, and the log stream is open the whole time.
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live log and progress arrive as server-sent events. Without these the page
        # looks frozen: nginx would sit on the stream instead of passing it through.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Harmless for plain HTTP, and there if a websocket is ever added.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ComfyFleet has no login. Anyone who can reach this port can queue work on your GPUs
    # and read the outputs. If the LAN is not entirely trusted, uncomment these two lines
    # after creating a password file:
    #     sudo apt install apache2-utils
    #     sudo htpasswd -c /etc/nginx/.htpasswd yourname
    #
    # auth_basic           "ComfyFleet";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
