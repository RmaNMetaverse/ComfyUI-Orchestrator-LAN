# ComfyFleet as a sub-path on a server that already hosts other things.
#
# This is NOT a server block. It is a pair of location blocks meant to sit inside the
# server block you already have, exactly like your /fflf-extractor/ app. Adding a second
# server block listening on 80 would fight the one you have - if its server_name matched
# first it would swallow the whole site, landing page included.
#
# Install:
#     sudo cp deploy/nginx-comfyfleet.conf /etc/nginx/snippets/comfyfleet.conf
#
# then add ONE line inside your existing server { ... }:
#     include /etc/nginx/snippets/comfyfleet.conf;
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# ComfyFleet is then at  http://your-server/comfyfleet/  (and https, same block).

# Without this, /comfyfleet has no trailing slash and the page's relative links would
# resolve against the site root and hit your other apps.
location = /comfyfleet {
    return 301 /comfyfleet/;
}

location /comfyfleet/ {
    # Trailing slash strips the prefix, so the Node server sees ordinary paths.
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        'upgrade';
    proxy_cache_bypass $http_upgrade;

    # The live log and per-machine progress are server-sent events. With buffering on,
    # nginx holds them and the page looks frozen until a run finishes.
    proxy_buffering off;
    proxy_cache off;

    # A render can hold its connection open for a long time.
    proxy_read_timeout    24h;
    proxy_send_timeout    24h;
    proxy_connect_timeout 60s;

    # Uploads inherit the server block's client_max_body_size (yours is 10G).
    # Uncomment to give ComfyFleet its own limit:
    # client_max_body_size 10G;
}

# ComfyFleet has no login of its own. Anyone who can reach this path can queue work on
# your GPUs and read the outputs. To put a password on just this app:
#     sudo apt install apache2-utils
#     sudo htpasswd -c /etc/nginx/.htpasswd yourname
# then add these two lines inside the location /comfyfleet/ block above:
#     auth_basic           "ComfyFleet";
#     auth_basic_user_file /etc/nginx/.htpasswd;
